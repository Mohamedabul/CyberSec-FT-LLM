# ─────────────────────────────────────────────────────────
# train_config.yaml
# Central config for Phase 4: QLoRA fine-tuning
# ─────────────────────────────────────────────────────────

model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  max_seq_length: 512           # Shorter = faster + fits more in batch
  trust_remote_code: true

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj" 
    - "k_proj" 
    - "v_proj" 
    - "o_proj" 
    - "gate_proj" 
    - "up_proj" 
    - "down_proj"

training:
  output_dir: "models/qwen25-3b-security/adapter"
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4       # Effective batch = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  fp16: false
  bf16: true
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  logging_steps: 25
  save_steps: 200
  eval_steps: 200
  save_total_limit: 2
  load_best_model_at_end: true
  report_to: "none"                    # Set to "wandb" if you use W&B

data:
  train_file: "dataset/train.jsonl"
  val_file:   "dataset/val.jsonl"
  test_file:  "dataset/test.jsonl"

save:
  adapter_dir: "models/qwen25-3b-security/adapter"
  merged_dir:  "models/qwen25-3b-security/merged"
