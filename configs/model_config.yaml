# ─────────────────────────────────────────────────────────
# model_config.yaml
# Base model and inference settings
# ─────────────────────────────────────────────────────────

base_model:
  name:               "Qwen/Qwen2.5-3B-Instruct"
  hf_id:              "Qwen/Qwen2.5-3B-Instruct"
  trust_remote_code:  true
  attn_implementation: "sdpa"

tokenizer:
  padding_side:    "right"
  max_length:      512
  add_eos_token:   true

quantization:
  load_in_4bit:             true
  bnb_4bit_quant_type:      "nf4"
  bnb_4bit_compute_dtype:   "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r:            16
  lora_alpha:   32
  lora_dropout: 0.0          # Must be 0 for Unsloth fast patching (QKV/O/MLP layers)
  bias:         "none"
  task_type:    "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

inference:
  max_new_tokens:     512
  temperature:        0.7
  top_p:              0.9
  repetition_penalty: 1.1
  do_sample:          true

save:
  adapter_dir: "models/qwen25-3b-security/adapter"
  merged_dir:  "models/qwen25-3b-security/merged"
